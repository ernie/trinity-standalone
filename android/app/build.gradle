plugins {
	id 'com.android.application'
}

// The CI tag or git describe, as com_engine reports it; versionCode is MMmmpp from the tag
def describe = System.getenv('GITHUB_REF_NAME')
if (!describe || !(describe ==~ /v\d.*/)) {
	try {
		describe = ['git', 'describe', '--tags', '--always', '--dirty'].execute(null, rootProject.projectDir).text.trim()
	} catch (Exception ignored) {
		describe = ''
	}
}
def tag = describe =~ /^v(\d+)\.(\d+)\.(\d+)/
def trinityVersionName = describe ? describe.replaceFirst(/^v/, '') : 'unknown'
def trinityVersionCode = tag.find() ? (tag.group(1) as int) * 10000 + (tag.group(2) as int) * 100 + (tag.group(3) as int) : 1

android {
	compileSdk 32
	buildToolsVersion "32.0.0"
	ndkVersion "27.3.13750724"
	namespace 'io.ernie.trinity'

	defaultConfig {
		applicationId 'io.ernie.trinity'
		minSdk 25
		targetSdk 26
		versionCode trinityVersionCode
		versionName trinityVersionName
		externalNativeBuild {
			cmake {
				arguments '-DANDROID_STL=c++_static'
			}
		}
		ndk {
			abiFilters 'arm64-v8a'
		}
	}
	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}
	externalNativeBuild {
		cmake {
			path 'src/main/cpp/CMakeLists.txt'
			version '3.22.1'
		}
	}
	sourceSets {
		main {
			jniLibs.srcDirs 'src/main/jniLibs'
		}
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_11
		targetCompatibility JavaVersion.VERSION_11
	}
	lint {
		// Headset apps are sideloaded or store-distributed, not on Google Play
		disable 'ExpiredTargetSdkVersion'
	}
}

dependencies {
	implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
	implementation 'androidx.appcompat:appcompat:1.0.2'
	implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
}
