name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # TRINITY_VERSION (single line at the repo root) pins the ernie/trinity
      # release this build ships: the game module libraries are compiled from
      # that tag's source, and the pak assets baked into the APK come from
      # that same release. One pin drives both; no job may reference the
      # "latest" trinity release.
      - name: Read Trinity pin
        run: |
          v="$(tr -d '[:space:]' < TRINITY_VERSION)"
          test -n "$v"
          echo "TRINITY_VERSION=$v" >> "$GITHUB_ENV"

      - name: Checkout Trinity source (pinned)
        uses: actions/checkout@v6
        with:
          repository: ernie/trinity
          ref: ${{ env.TRINITY_VERSION }}
          path: trinity

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          $SDKMANAGER "ndk;27.3.13750724" "cmake;3.22.1" "build-tools;32.0.0"

      - name: Download Trinity assets (pinned)
        run: |
          BASE=https://github.com/ernie/trinity/releases/download/$TRINITY_VERSION
          curl -fL -o android/app/src/main/assets/pak8t.pk3 $BASE/pak8t.pk3
          curl -fL -o android/app/src/main/assets/pak3t.pk3 $BASE/pak3t.pk3
          curl -fL -o android/app/src/main/assets/zzz-trinity-announcer.pk3 $BASE/zzz-trinity-announcer.pk3
          # Outside assets/, so the checksum list is not bundled into the APK
          curl -fL -o "$RUNNER_TEMP/sha256sums.txt" $BASE/sha256sums.txt
          (cd android/app/src/main/assets && sha256sum --check --strict "$RUNNER_TEMP/sha256sums.txt")

      - name: CMake configure
        run: |
          cmake -Wno-deprecated -B build -S android/app/src/main/cpp \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_SDK_ROOT/ndk/27.3.13750724/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DFULL_BUILD=ON \
            -DTRINITY_SOURCE_DIR="${{ github.workspace }}/trinity" \
            -G Ninja

      - name: CMake build
        run: cmake --build build -j$(nproc)

      - name: Gradle build
        working-directory: android
        run: ./gradlew :app:assembleRelease

      - name: Sign APK
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/keystore.jks
          APKSIGNER=$ANDROID_SDK_ROOT/build-tools/32.0.0/apksigner
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION=${GITHUB_REF_NAME#v}
          else
            VERSION=$(git show -s --pretty=format:%h)
          fi
          OUTDIR=android/app/build/outputs/apk/release
          SIGNED=$OUTDIR/trinity-standalone.apk
          $APKSIGNER sign \
            --ks /tmp/keystore.jks \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --out "$SIGNED" \
            --v2-signing-enabled true \
            "$UNSIGNED"
          rm /tmp/keystore.jks
          rm "$UNSIGNED"
          # Clients built with UPDATE_ASSET_PREFIX "trinity-quest" look for this name.
          # They carry a different package, so this installs beside them and their
          # home directory is copied on first launch. The v2 signature covers
          # contents, not filename, so the copy stays valid.
          # TODO: remove once "trinity-quest" clients have aged out.
          cp "$SIGNED" "$OUTDIR/trinity-quest-${VERSION}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: trinity-standalone-apk
          path: |
            android/app/build/outputs/apk/release/trinity-standalone.apk
            android/app/build/outputs/apk/release/trinity-quest-*.apk
          if-no-files-found: error
          retention-days: 5

  release:
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: trinity-standalone-apk
          path: dist

      - name: Fetch OpenAL Soft source
        run: |
          # LGPL-2 wants corresponding source offered from the same place as the
          # binary. Version tracks libs/android/arm64-v8a/BUILD_LIBOPENAL.md.
          OPENAL_VERSION=1.25.1
          curl -sSfL \
            -o "dist/openal-soft-${OPENAL_VERSION}-source.tar.gz" \
            "https://github.com/kcat/openal-soft/archive/refs/tags/${OPENAL_VERSION}.tar.gz"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/trinity-standalone.apk
            dist/trinity-quest-*.apk
            dist/openal-soft-*-source.tar.gz
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' }}
